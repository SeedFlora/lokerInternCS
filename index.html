<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>lokerInternCS pindah alamat</title>
    <link rel="canonical" href="https://loker.budijuarto.com/">
    <script>
      const newSite = new URL("https://loker.budijuarto.com/");
      const sections = new Map([
        ["#kalender", "/kalender"],
        ["#rekomendasi", "/tier"],
        ["#tentang", "/tentang"],
      ]);
      const section = sections.get(window.location.hash);
      if (section) {
        newSite.pathname = section;
      } else {
        newSite.hash = window.location.hash;
      }
      newSite.search = window.location.search;
      window.location.replace(newSite.href);
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=https://loker.budijuarto.com/"></noscript>
  </head>
  <body>
    <main>
      <h1>lokerInternCS pindah alamat</h1>
      <p>Buka <a href="https://loker.budijuarto.com/">loker.budijuarto.com</a> untuk melihat lowongan terbaru.</p>
    </main>
  </body>
</html>
